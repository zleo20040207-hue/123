<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專業名片</title>
    <!-- 引入 LINE SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <button id="sendBtn" style="padding: 15px 30px; font-size: 18px; border-radius: 8px;">傳送名片給好友</button>
        <p id="status" style="margin-top: 20px; color: gray;">正在初始化 LINE 環境...</p>
    </div>

    <script>
        async function main() {
            try {
                // 1. 這裡一定要填寫你的 LIFF ID
                await liff.init({ liffId: "2009945339-gSC7epzX" });
                
                document.getElementById('status').innerText = "環境準備就緒！";
                
                document.getElementById('sendBtn').onclick = () => {
                    // 2. 檢查權限
                    if (liff.isApiAvailable('shareTargetPicker')) {
                        liff.shareTargetPicker([
                            {
                                "type": "flex",
                                "altText": "您好，這是我的專業名片",
                                "contents": {
                                    "type": "bubble",
                                    "hero": {
                                        "type": "image",
                                        "url": "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",
                                        "size": "full",
                                        "aspectRatio": "20:13",
                                        "aspectMode": "cover"
                                    },
                                    "body": {
                                        "type": "box",
                                        "layout": "vertical",
                                        "contents": [
                                            {
                                                "type": "text",
                                                "text": "Brown Cafe",
                                                "weight": "bold",
                                                "size": "xl"
                                            }
                                            // ... 其他內容保持不變
                                        ]
                                    },
                                    "footer": {
                                        "type": "box",
                                        "layout": "vertical",
                                        "spacing": "sm",
                                        "contents": [
                                            {
                                                "type": "button",
                                                "style": "link",
                                                "height": "sm",
                                                "action": {
                                                    "type": "uri",
                                                    "label": "CALL",
                                                    "uri": "tel:0912345678"
                                                }
                                            }
                                        ]
                                    }
                                }
                            }
                        ]).then(() => {
                            console.log("發送成功");
                        }).catch((error) => {
                            console.log("取消發送");
                        });
                    } else {
                        alert("請至 LINE Developers 後台開啟 shareTargetPicker 開關");
                    }
                };
            } catch (err) {
                document.getElementById('status').innerText = "初始化失敗：" + err;
            }
        }
        main();
    </script>
</body>
</html>
